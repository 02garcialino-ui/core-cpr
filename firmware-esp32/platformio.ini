; =====================================================
;  PlatformIO - Core CPR (firmware principal)
;  El codigo vive en src/ (firmware-esp32.ino + todos los modulos
;  .h/.cpp) -- se movieron ahi el 2026-08-05, antes vivian sueltos
;  en esta carpeta (formato Arduino IDE clasico).
; =====================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad de la consola serial -- tiene que coincidir con el
; SERIAL_BAUDIOS de config.h (115200).
monitor_speed = 115200

; Librerias que necesita el modo real (MODO_SIMULACION false):
;   - MAX3010x: driver del MAX30102 (PPG), usado en sensor_ppg.cpp
;   - Adafruit VL53L0X: driver del laser de profundidad, usado en
;     sensor_profundidad.cpp
;   - Adafruit BusIO: dependencia de la libreria de Adafruit de arriba
;     (se declara explicita por las dudas, para que no falte si el
;     resolvedor automatico de dependencias no la agarra sola)
lib_deps =
    https://github.com/sparkfun/SparkFun_MAX3010x_Sensor_Library.git
    https://github.com/adafruit/Adafruit_VL53L0X.git
    https://github.com/adafruit/Adafruit_BusIO.git
