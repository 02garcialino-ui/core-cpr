; =====================================================
;  PlatformIO - Lector ECG (prueba aislada de hardware)
;  Mismo sketch que lector-ecg.ino, reorganizado para PlatformIO.
; =====================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad de la consola serial -- tiene que coincidir con el
; Serial.begin(115200) del codigo (src/main.cpp).
monitor_speed = 115200
