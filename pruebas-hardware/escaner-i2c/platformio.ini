; =====================================================
;  PlatformIO - Escaner I2C (prueba aislada de hardware)
;  Mismo sketch que escaner-i2c.ino, reorganizado para PlatformIO.
;  El codigo vive en src/main.cpp -- este archivo solo dice
;  "que placa es" y "a que velocidad hablar por el puerto serial".
; =====================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidad de la consola serial -- tiene que coincidir con el
; Serial.begin(115200) del codigo (src/main.cpp), si no, se ven
; caracteres raros en el Monitor Serie.
monitor_speed = 115200
